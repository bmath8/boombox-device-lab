name: Android Chrome (emulator)
on:
  workflow_dispatch:
    inputs:
      base: { description: Site to test, default: 'https://boom-box-v-5.vercel.app' }
      pages: { description: Signed-in pages (comma list, blank = default), default: '' }
permissions:
  contents: write
jobs:
  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - { device: pixel_7, api: 35, label: 'Pixel 7 Android 15' }
          - { device: pixel_tablet, api: 35, label: 'Pixel Tablet Android 15' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund playwright-core@1.56.1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          BASE: ${{ inputs.base }}
          PAGES: ${{ inputs.pages }}
          DEVICE: ${{ matrix.label }}
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.device }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tests/android-run.sh || echo "RUN_FAILED=1" >> $GITHUB_ENV
      - name: Encrypt and store results
        if: always()
        env: { LAB_KEY: '${{ secrets.LAB_KEY }}' }
        run: |
          TAG="$(echo '${{ matrix.label }}' | tr -c 'A-Za-z0-9\n' '-')-${{ github.run_id }}"
          mkdir -p out; tar czf r.tgz out
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:LAB_KEY -in r.tgz -out "$TAG.tgz.enc"
          git config user.name lab; git config user.email lab@users.noreply.github.com
          git fetch origin results || true
          git checkout -B results origin/results 2>/dev/null || git checkout --orphan results
          git rm -rfq --cached . >/dev/null 2>&1 || true
          mkdir -p runs && mv "$TAG.tgz.enc" runs/
          git add runs/; git commit -qm "results $TAG"
          for i in 1 2 3 4; do git pull -q --rebase origin results 2>/dev/null; git push -q origin HEAD:results && break; sleep $((i*5)); done
