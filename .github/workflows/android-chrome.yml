name: Android Chrome (emulator)
on:
  workflow_dispatch:
    inputs:
      base: { description: Site to test, default: 'https://boom-box-v-5.vercel.app' }
      pages: { description: Signed-in pages (comma list, blank = default), default: '' }
permissions:
  contents: write
jobs:
  chrome:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - { device: pixel_7, api: 36, label: 'Pixel 7 Android 16' }
          - { device: pixel_4a, api: 34, label: 'Pixel 4a Android 14' }
          - { device: pixel_tablet, api: 36, label: 'Pixel Tablet Android 16' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund playwright-core@1.56.1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          BASE: ${{ inputs.base }}
          PAGES: ${{ inputs.pages }}
          DEVICE: ${{ matrix.label }}
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.device }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tests/android-run.sh || echo "RUN_FAILED=1" >> $GITHUB_ENV
      - name: Encrypt and store results
        if: always()
        env:
          LAB_KEY: ${{ secrets.LAB_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: bash tests/store.sh "$(echo '${{ matrix.label }}' | tr -c 'A-Za-z0-9\n' '-')-${{ github.run_id }}-${{ github.run_attempt }}"
